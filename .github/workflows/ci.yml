name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check server/src/index.js
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm run install:all
      - name: Build frontend
        run: npm run build
